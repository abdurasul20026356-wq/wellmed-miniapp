<!doctype html><html><head><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Well Med Mini App (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#F5FBF7; --bg2:#EAF7F0;
  --mint:#DDFBE5; --green-l:#B8F3C5; --cyan:#A9E8F5; --sky:#D9F5FA;
  --green:#168C68; --green-press:#11755A; --text:#10251F; --muted:#557168; --line:rgba(22,140,104,.14);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.82); --glass-border:rgba(255,255,255,.75);
  --shadow:0 10px 30px rgba(16,37,31,.08),0 1px 3px rgba(16,37,31,.06);
  --ok:#168C68; --warn:#B7791F; --bad:#C0392B; --info:#1B7FA6;
  --on-green:#fff; --blob1:#B8F3C5; --blob2:#A9E8F5;
  --r:24px; --r-sm:16px;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Unbounded","Onest",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#08140F; --bg2:#0C1D17; --mint:#123126; --green-l:#1C4A39; --cyan:#12414D; --sky:#0F2E36;
  --green:#3FD29C; --green-press:#34B886; --text:#E4F4EC; --muted:#8FB0A4; --line:rgba(63,210,156,.16);
  --glass:rgba(22,44,36,.55); --glass-strong:rgba(22,44,36,.82); --glass-border:rgba(255,255,255,.08);
  --shadow:0 10px 30px rgba(0,0,0,.35); --on-green:#062018; --blob1:#0F5C45; --blob2:#0D4A5A;
  --ok:#3FD29C; --warn:#E8B04A; --bad:#FF7A6B; --info:#5CC8EE;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#08140F; --bg2:#0C1D17; --mint:#123126; --green-l:#1C4A39; --cyan:#12414D; --sky:#0F2E36;
  --green:#3FD29C; --green-press:#34B886; --text:#E4F4EC; --muted:#8FB0A4; --line:rgba(63,210,156,.16);
  --glass:rgba(22,44,36,.55); --glass-strong:rgba(22,44,36,.82); --glass-border:rgba(255,255,255,.08);
  --shadow:0 10px 30px rgba(0,0,0,.35); --on-green:#062018; --blob1:#0F5C45; --blob2:#0D4A5A;
  --ok:#3FD29C; --warn:#E8B04A; --bad:#FF7A6B; --info:#5CC8EE;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:10px}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.ambient i:nth-child(1){width:320px;height:320px;background:var(--blob1);top:-90px;right:-80px}
.ambient i:nth-child(2){width:280px;height:280px;background:var(--blob2);top:240px;left:-120px;opacity:.4}
.ambient i:nth-child(3){width:260px;height:260px;background:var(--blob1);bottom:-120px;right:-60px;opacity:.3}
#app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:12px 110px}
.glass{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow);border-radius:var(--r)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em}
.preview-pill{background:var(--sky);color:var(--info);border:1px solid var(--line)}
.h1{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.2;letter-spacing:-.01em;margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:500;font-size:17px;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.cap{font-size:12.5px;color:var(--muted)}
.btn,.li{text-decoration:none;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:600;transition:transform .15s,background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--green);color:var(--on-green)!important;width:100%}
.btn-primary:hover{background:var(--green-press)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-ghost{background:var(--glass-strong);border:1px solid var(--line);color:var(--text)}
.btn-sm{min-height:38px;padding:0 14px;font-size:13.5px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.screen{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* splash */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:opacity .45s,filter .45s}
#splash.hide{opacity:0;filter:blur(8px);pointer-events:none}
#splash .inner{display:flex;flex-direction:column;align-items:center;gap:14px;animation:glow 1.1s ease-out both}
#splash img{width:min(260px,70vw);filter:drop-shadow(0 8px 30px rgba(22,140,104,.25))}
@keyframes glow{from{opacity:0;transform:scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* top */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 14px}
.topbar img{height:36px;width:auto}
.lang-mini{display:flex;background:var(--glass-strong);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang-mini button{padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.lang-mini button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}

/* choice cards */
.choice{display:flex;align-items:center;gap:14px;padding:16px;text-align:left;width:100%;transition:transform .15s,border-color .2s}
.choice:active{transform:scale(.98)}
.choice .ico{flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,var(--mint),var(--sky))}
.choice b{display:block;font-size:15.5px}
.choice[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 2px var(--green),var(--shadow)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{min-height:50px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--glass-strong);outline:none;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--line)}
.field.err input{border-color:var(--bad)}
.field .e{font-size:12px;color:var(--bad);min-height:0}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* home */
.hello{padding:18px}
.badge{background:var(--mint);color:var(--green);border:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:52px}
.search input{flex:1;border:0;background:transparent;outline:none;min-height:50px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:10px;padding:16px;text-align:left;min-height:120px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,var(--mint),var(--sky))}
.tile b{font-size:14.5px;line-height:1.25}
.tile .cap{margin-top:auto}
.soon{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--warn)}
.catalog-cta{display:flex;align-items:center;gap:14px;padding:16px 18px;background:linear-gradient(120deg,var(--green),#1FA7A0);color:#fff;border-radius:var(--r);box-shadow:var(--shadow);width:100%;text-align:left}
.catalog-cta b{font-family:var(--display);font-weight:500;font-size:15px;display:block}

/* products */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--glass-strong);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:transparent}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:transform .15s}
.pcard:active{transform:scale(.97)}
.pimg{aspect-ratio:1/1;border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden;max-width:100%}
.pimg img{width:100%;height:100%;object-fit:contain;padding:8px}
.pcard b{font-size:14px;padding-inline:4px}
.pcard .cap{padding-inline:4px}
.empty{padding:32px 18px;text-align:center}
.empty .big{font-size:40px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,20,15,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:460px;margin:0 auto;max-height:90%;overflow-y:auto;border-radius:28px 28px 0 0;background:var(--bg);box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.hero-img{aspect-ratio:4/3;border-radius:24px;background:#fff;display:grid;place-items:center;overflow:hidden;max-width:100%}
.hero-img img{max-height:100%;object-fit:contain;padding:14px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .l{display:flex;align-items:center;gap:12px}
.safety{padding:14px 16px;border-radius:var(--r-sm);background:var(--sky);color:var(--text);font-size:13px;border:1px solid var(--line)}
.data-req{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);letter-spacing:.03em}
code.cmd{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--mint);color:var(--green);padding:3px 8px;border-radius:8px;font-size:13.5px}
.qty{display:flex;align-items:center;gap:6px;background:var(--glass-strong);border:1px solid var(--line);border-radius:999px;padding:3px}
.qty button{width:34px;height:34px;border-radius:50%;background:var(--mint);font-weight:700;font-size:18px;color:var(--green)}
.qty span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.notice{display:flex;gap:10px;padding:14px 16px;border-radius:var(--r-sm);border:1px dashed var(--warn);color:var(--text);font-size:13.5px;background:color-mix(in srgb,var(--warn) 8%,transparent)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:26px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:20px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--green);background:var(--mint)}
.nav .dot{position:absolute;top:4px;right:calc(50% - 18px);min-width:17px;height:17px;border-radius:9px;background:var(--green);color:var(--on-green);font-size:10px;display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:40;padding:12px 18px;border-radius:999px;background:var(--text);color:var(--bg);font-size:13.5px;font-weight:600;transition:all .3s;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
</style>

<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="splash"><div class="inner"><img id="splashLogo" alt="WELL MED PHARM"><div class="cap" id="splashTag">Born to care &amp; cure</div></div></div>
<main id="app"></main>
<nav class="nav" id="nav" hidden><div class="in glass" id="navIn"></div></nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></section>
<div class="toast" id="toast" role="status"></div>

  async call(path, opts){
    if(!BACKEND_CONFIGURED) throw new Error("backend_not_configured");
    const res = await fetch(this.base()+path, Object.assign({headers:this.headers()}, opts||{}));
    const j = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(j.error || "request_failed");

/* ---------- render ---------- */
function renderNav(){
  const onb=S.step!=="main"; $("#nav").hidden=onb; if(onb) return;
  if(S.role==="PATIENT"){
    const items=[
      {tab:"home", icon:I.home, label:t().nav.home},
      {tab:"products", icon:I.products, label:t().tiles.products[0]},
      {sheet:"symptom", icon:"🩺", label:t().tiles.symptom[0]},
      {sheet:"saved", icon:"❤️", label:t().tiles.saved[0]},
      {tab:"profile", icon:I.profile, label:t().nav.profile}
    ];
    $("#navIn").innerHTML=items.map(n=>{
      const active = n.tab && S.tab===n.tab;
      const iconHtml = typeof n.icon==="string" ? `<span style="font-size:20px;line-height:1">${n.icon}</span>` : n.icon;
      return `<button ${n.tab?`data-tab="${n.tab}"`:`data-navsheet="${n.sheet}"`} ${active?'aria-current="page"':""}>${iconHtml}<span>${esc(n.label)}</span></button>`;
    }).join("");
    return;
  }
  $("#navIn").innerHTML=["home","products","orders","support","profile"].map(k=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${I[k]}<span>${esc(t().nav[k])}</span>${k==="orders"&&cartCount()?`<span class="dot">${cartCount()}</span>`:""}</button>`).join("");
}
function render(){
  document.documentElement.lang=S.lang;
  const v={lang:vLang,welcome:vWelcome,role:vRole,form:vForm}[S.step];
  app.innerHTML = v? v() : ({home:vHome,products:vProducts,orders:vOrders,support:vSupport,profile:vProfile}[S.tab])();
  renderNav(); save();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,a,[data-close]"); if(!b) return;
  const d=b.dataset;
  if(e.target===$("#scrim")) return closeSheet();
  if(d.pickLang){S.lang=d.pickLang;haptic();return render()}
  if(d.lang){S.lang=d.lang;haptic();render();return}
  if(d.go){S.step=d.go;haptic();window.scrollTo(0,0);return render()}
  if(d.role){S.role=d.role;haptic();return render()}
  if(d.tab){closeSheet();S.step="main";S.tab=d.tab;window.scrollTo(0,0);haptic();render();if(d.tab==="profile")refreshPatientCounts();return}
  if(d.prod) return sheetProduct(d.prod);
  if("catalog" in d) return sheetCatalog();
  if(d.tile==="products"||d.tile==="order"){S.tab="products";return render()}
  if(d.tile==="leaflets") return sheetLeaflets();
  if(d.tile==="support"){S.tab="support";return render()}
  if(d.tile==="symptom") return sheetSymptoms();
  if(d.tile==="myRequests") return sheetMyRequests();
  if(d.tile==="saved") return sheetFavorites();
  if(d.tile==="pOrders") return sheetOrders();
  if(d.tile==="pharmacist") return sheetPharmacist();
  if(d.tile==="notifications") return sheetNotifications();
  if(d.tile==="supportHistory") return sheetSupportHistory();
  if(d.tile==="profileTile"){S.tab="profile";return render()}
  if(d.navsheet==="symptom") return sheetSymptoms();
  if(d.navsheet==="saved") return sheetFavorites();
  if(d.fav) return toggleFavorite(d.fav);
  if(d.reqdetail) return sheetRequestDetail(d.reqdetail);
  if(d.supportType){ supportSelType=d.supportType; haptic(); return renderPharmacistSheet(); }
  if("supportSend" in d) return submitSupport();
  if(d.symtoggle){ symSel.has(d.symtoggle)?symSel.delete(d.symtoggle):symSel.add(d.symtoggle); haptic(); return renderSymSheet(); }
  if("symcustom" in d){ symSel.has("__custom")?symSel.delete("__custom"):symSel.add("__custom"); haptic(); return renderSymSheet(); }
  if("symsubmit" in d) return submitSymptoms();
  if(d.phase) return sheetSoon(d.phase);
  if("close" in d) return closeSheet();
  if(d.add){S.cart[d.add]=(S.cart[d.add]||0)+1;haptic();toast(t().added);closeSheet();return renderNav(),save()}
  if(d.inc){S.cart[d.inc]++;return render()}
  if(d.dec){S.cart[d.dec]--; if(S.cart[d.dec]<=0) delete S.cart[d.dec]; return render()}
  if(d.copy){const txt=d.copy; const done=()=>toast(t().copied+": "+txt);
    try{navigator.clipboard.writeText(txt).then(done,()=>toast(txt))}catch(_){toast(txt)} return}
  if("reset" in d){try{localStorage.removeItem(KEY)}catch(_){} S={lang:S.lang,step:"lang",role:null,profile:null,tab:"home",cart:{},q:""};toast(t().resetDone);return render()}
});
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("input",e=>{
  if(e.target.id==="prodSearch"){S.q=e.target.value;$("#plist").innerHTML=pgrid(PRODUCTS.filter(p=>matches(p,S.q)))}
  if(e.target.id==="symCustomInput"){window.__symCustomText=e.target.value}
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="homeSearch"&&e.key==="Enter"){S.q=e.target.value;S.tab="products";render()}
  if(e.key==="Escape") closeSheet();
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="regForm") return; e.preventDefault();
  const fd=Object.fromEntries(new FormData(e.target)); let ok=true;
  FORMS[S.role].forEach(([k,r])=>{const w=e.target.querySelector(`[data-f="${k}"]`); let msg="";
    const v=(fd[k]||"").trim();
    if(r&&!v) msg=t().req; else if(k==="phone"&&v&&v.replace(/\D/g,"").length<12) msg=t().badPhone;
    w.classList.toggle("err",!!msg); w.querySelector(".e").textContent=msg; if(msg) ok=false; fd[k]=v;});
  if(!ok){e.target.classList.remove("shake");void e.target.offsetWidth;e.target.classList.add("shake");return}
  S.profile=fd; S.step="main"; S.tab="home"; haptic(); window.scrollTo(0,0); render();
  api.saveProfile(S.role, fd);
});

/* ---------- boot ---------- */
if(tg){try{tg.ready();tg.expand()}catch(e){}}
$("#splashLogo").src=ASSETS.logo;
render();
setTimeout(()=>{$("#splash").classList.add("hide");setTimeout(()=>$("#splash").remove(),500)},1000);
api.authPing();
if(S.role==="PATIENT" && BACKEND_CONFIGURED && tg && tg.initData){
  api.fetchFavorites().then(rows=>{ favSlugs=new Set((rows||[]).map(r=>r.slug)); if(S.step==="main"&&S.tab==="home") render(); }).catch(()=>{});
  refreshNotifCount();
  refreshPatientCounts();
}
api.fetchProducts().then(rows=>{
  if(!rows) return;
  rows.forEach(r=>{
    const id=r.slug;
    const sub=(r.form_uz||r.form_ru||r.form_en)?{uz:r.form_uz||"",ru:r.form_ru||"",en:r.form_en||""}:null;
    const idx=PRODUCTS.findIndex(p=>p.id===id);
    const merged={id,name:r.name,sub,alias:r.search_alias||"",image_url:r.image_url,docs:(idx>=0?PRODUCTS[idx].docs:[])};
    if(idx>=0) PRODUCTS[idx]=Object.assign({},PRODUCTS[idx],merged); else PRODUCTS.push(merged);
  });
  if(S.step==="main" && S.tab==="products") render();
}).catch(()=>{});
</script>

</body></html>
